<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ananya Aggarwal. Backend, databases, distributed systems.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M24 44 V24 H44"/>
    <path d="M1156 24 H1176 V44"/>
    <path d="M24 296 V316 H44"/>
    <path d="M1156 316 H1176 V296"/>
  </g>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#ffffff" fill-opacity="0.28">
    <text x="56" y="32">0,0</text>
    <text x="1144" y="32" text-anchor="end">1200,0</text>
    <text x="56" y="324">0,340</text>
    <text x="1144" y="324" text-anchor="end">1200,340</text>
  </g>

  <!-- eyebrow -->
  <text x="600" y="112" text-anchor="middle"
        font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14" letter-spacing="4" fill="#8b949e">BACKEND  ·  DATABASES  ·  DISTRIBUTED SYSTEMS</text>

  <!-- name -->
  <text x="600" y="190" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Ananya Aggarwal</text>

  <!-- accent rule -->
  <rect x="300" y="212" width="600" height="2" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="600" y="248" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" fill="#c9d1d9">Understanding what happens behind the API.</text>
  <text x="600" y="278" text-anchor="middle"
        font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="13" letter-spacing="1" fill="#6e7681">MCA · USICT Delhi  ·  Open to SDE / backend roles</text>
</svg>
